name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-cli:
    name: Pipeline CLI (apps/pipeline-cli)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/pipeline-cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run unit tests
        run: bun test tests/
      - name: CLI smoke (version + Node bundle build)
        run: |
          bun src/cli.ts --version
          bun run build

  manifest-validation:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate plugin manifest, hooks, agents, skills
        run: python .github/scripts/validate-manifest.py
