name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-cli:
    name: Pipeline CLI (apps/pipeline-cli)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/pipeline-cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run unit tests
        run: bun test tests/
      - name: CLI smoke (version + Node bundle build)
        run: |
          bun src/cli.ts --version
          bun run build

  # ── The plugin's own tests (plugin-thin `p5`, narrowed by `p6`) ────────────
  # `tests/` at the REPOSITORY ROOT covers what is genuinely THIS repository's
  # and does not travel with the CLI.
  #
  # `p5` put thirteen hook suites here, beside the `hooks/*.ts` relays they
  # covered. `p6` turned those relays into `pipeline hook <name>` subcommands
  # in `IvanMurzak/pipeline`, and twelve of the thirteen went with them — a
  # test lives in the tree that contains what it tests, and after the move that
  # tree is the CLI's. They run there in the `Pipeline CLI` job, on the same
  # two-OS matrix; that job's own header says so, because A RELOCATED TEST NO
  # JOB RUNS IS A DELETED TEST.
  #
  # What remains here is what `p6` deliberately did NOT move:
  #   • hook-run-shim.test.ts — `hooks/run-hook.sh` (which survives, resolving
  #     `pipeline` instead of `bun`) and the `hooks.json` wiring that routes
  #     through it, including the committed 100755 mode. Both files are this
  #     plugin's; moving their test to the CLI would have left it testing
  #     nothing.
  #   • cli-package-self-contained.test.ts — the guard that `apps/pipeline-cli`
  #     reaches nothing above itself, which is what makes deleting that
  #     directory safe. It goes away with the directory, not before.
  #
  # This is still a SEPARATE job rather than a step in `pipeline-cli` above,
  # for the original reason: when `apps/pipeline-cli` is finally deleted, that
  # job leaves with it and this one must not.
  #
  # NO ROOT `package.json`, DELIBERATELY. Claude Code installs a plugin by
  # cloning this repository — there is no install step, ever. A root manifest
  # would imply one, would put a second `name`/`version` beside
  # `.claude-plugin/plugin.json`, and would risk the marketplace loader for a
  # test runner that does not need it: `bun test` needs no manifest and no
  # install to run the directory it is started in. That is what this job does.
  #
  # Both operating systems, because these are the files most exposed to the
  # difference: `run-hook.sh` is POSIX sh (its resolution-chain block self-skips
  # where `sh` is unavailable, while the `hooks.json` wiring assertions still
  # run), and the daemon-lock tests turn on `wx` exclusive-create and real
  # cross-process spawns.
  plugin-hooks:
    name: Plugin hooks + shim (tests/)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ⚠ `working-directory`, NOT `bun test tests/`. A positional argument to
    # `bun test` is a FILE-NAME FILTER, not a directory scope — `bun test
    # --help` says so ("Run all test files with 'foo' or 'bar' in the file
    # name"). `bun test tests/` from the root therefore matched every path
    # containing `tests/`, which is `apps/pipeline-cli/tests/` and the
    # templates' suites too: the first run of this job executed 2427 tests
    # across 119 files and duplicated the whole `pipeline-cli` job. Bun scans
    # from its working directory, so scoping it means putting it there.
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install step and no manifest — see the note above.
      - name: Run plugin tests
        run: bun test

  manifest-validation:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate plugin manifest, hooks, agents, skills
        run: python .github/scripts/validate-manifest.py
